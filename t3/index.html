<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operación Extracción · FPS 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div class="topbar"><b>OPERACIÓN EXTRACCIÓN</b><span>OBJETIVO: LLEGA A LA EXTRACCIÓN</span></div>
    <div class="stats"><span id="weapon">ARMA 1 · CARABINA</span><span id="ammo">MUNICIÓN 12</span><span id="health">SALUD 100</span><span id="threats">AMENAZAS 0/5</span></div>
    <div id="hint">WASD mover · Mouse mirar · Clic disparar · 1/2 armas · R reiniciar</div>
    <div id="crosshair"><i></i><b></b><em></em><strong></strong></div>
    <div id="message" class="hidden"></div>
    <div id="start"><h1>OPERACIÓN<br><span>EXTRACCIÓN</span></h1><p>Sobrevive a la zona infestada y llega al helicóptero.</p><button id="startBtn" type="button" onclick="window.startMission()">INICIAR MISIÓN</button><small>Haz clic para capturar el mouse</small></div>
  </div>
  <script>
    window.startMission = function () {
      window.missionStarted = true;
      document.getElementById('start').classList.add('hidden');
      window.dispatchEvent(new Event('missionstart'));
    };
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
